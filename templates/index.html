<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #181818;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #212121;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 500px;
            text-align: center;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #121212;
            color: #fff;
            box-sizing: border-box;
        }

        button {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
        }

        button:hover {
            background-color: #cc0000;
        }

        /* Modal Overlay */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        /* Modal Popup with Bounce Effect */
        .modal-box {
            background-color: #282828;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.8);
            animation: bounceIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.3); }
            50% { opacity: 1; transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        select {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            border-radius: 6px;
            background: #121212;
            color: #fff;
            border: 1px solid #444;
        }

        /* Copyable Error Box */
        .error-container {
            display: none;
            margin-top: 20px;
            background: #2d1313;
            border: 1px solid #ff4d4d;
            border-radius: 8px;
            padding: 12px;
            text-align: left;
        }

        textarea.error-box {
            width: 100%;
            height: 100px;
            background: #1a0808;
            color: #ff9999;
            border: 1px solid #ff4d4d;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 8px;
        }

        .copy-btn {
            background-color: #444;
            font-size: 12px;
            padding: 6px 12px;
            width: auto;
        }

        .copy-btn:hover {
            background-color: #666;
        }

        .progress-bar {
            width: 100%;
            background-color: #333;
            border-radius: 6px;
            margin-top: 15px;
            overflow: hidden;
            display: none;
        }

        .progress-fill {
            height: 18px;
            background-color: #ff0000;
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>YouTube Downloader</h2>
    <input type="text" id="videoUrl" placeholder="Paste YouTube Link Here">
    <button onclick="fetchFormats()">Fetch Options</button>

    <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
    </div>
    <p id="statusText"></p>

    <!-- Error Container -->
    <div class="error-container" id="errorContainer">
        <label style="color:#ff4d4d; font-weight:bold; font-size:12px;">Error Log:</label>
        <textarea id="errorText" class="error-box" readonly></textarea>
        <button class="copy-btn" onclick="copyError()">Copy Error Log</button>
    </div>
</div>

<!-- Format Modal -->
<div class="modal-overlay" id="formatModal">
    <div class="modal-box">
        <h3 id="modalTitle" style="margin-top:0; font-size:16px;">Select Quality</h3>
        <select id="formatSelect"></select>
        <button onclick="startDownload()">Download Selected Format</button>
    </div>
</div>

<script>
    let currentUrl = '';
    let pollInterval = null;

    async function fetchFormats() {
        const url = document.getElementById('videoUrl').value.trim();
        if (!url) return alert('Please enter a valid URL');

        currentUrl = url;
        hideError();
        document.getElementById('statusText').innerText = 'Fetching available formats...';

        try {
            const response = await fetch('/get-formats', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url })
            });

            const data = await response.json();

            if (!response.ok || data.error) {
                showError(data.error || 'Failed to parse video info.');
                document.getElementById('statusText').innerText = '';
                return;
            }

            document.getElementById('statusText').innerText = '';
            document.getElementById('modalTitle').innerText = data.title;

            const select = document.getElementById('formatSelect');
            select.innerHTML = '';
            data.formats.forEach(f => {
                const opt = document.createElement('option');
                opt.value = f.format_id;
                opt.innerText = f.label;
                select.appendChild(opt);
            });

            document.getElementById('formatModal').style.display = 'flex';
        } catch (err) {
            showError(err.toString());
        }
    }

    async function startDownload() {
        document.getElementById('formatModal').style.display = 'none';
        const selectedFormat = document.getElementById('formatSelect').value;

        document.getElementById('progressBar').style.display = 'block';
        document.getElementById('statusText').innerText = 'Starting download...';

        try {
            const response = await fetch('/download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: currentUrl, format_id: selectedFormat })
            });

            const data = await response.json();
            if (data.error) {
                showError(data.error);
            } else {
                pollInterval = setInterval(checkProgress, 1000);
            }
        } catch (err) {
            showError(err.toString());
        }
    }

    async function checkProgress() {
        try {
            const res = await fetch('/progress');
            const data = await res.json();

            if (data.status === 'downloading') {
                document.getElementById('progressFill').style.width = data.progress + '%';
                document.getElementById('statusText').innerText = `${data.progress}% - ${data.speed} (ETA: ${data.eta})`;
            } else if (data.status === 'finished') {
                document.getElementById('progressFill').style.width = '100%';
                document.getElementById('statusText').innerText = 'Download Complete!';
                clearInterval(pollInterval);
            } else if (data.status === 'error') {
                clearInterval(pollInterval);
                showError(data.error);
                document.getElementById('statusText').innerText = '';
            }
        } catch (err) {
            clearInterval(pollInterval);
            showError(err.toString());
        }
    }

    function showError(msg) {
        document.getElementById('errorContainer').style.display = 'block';
        document.getElementById('errorText').value = msg;
    }

    function hideError() {
        document.getElementById('errorContainer').style.display = 'none';
        document.getElementById('errorText').value = '';
    }

    function copyError() {
        const errorText = document.getElementById('errorText');
        errorText.select();
        document.execCommand('copy');
        alert('Error copied to clipboard!');
    }
</script>

</body>
</html>
